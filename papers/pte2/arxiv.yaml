#
# arxiv-submission/ is a build artifact; this file is not. Only the abstract is overridden,
# and only because the paper's own abstract is 2301 characters — over arXiv's ~1920-char
# metadata limit. The paper itself is unchanged: this is the arXiv *metadata* abstract.
# Trimming removed connective tissue and closing summary sentences; every numeric result is

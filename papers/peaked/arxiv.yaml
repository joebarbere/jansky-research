abstract: |
  Gigahertz-Peaked-Spectrum (GPS) and Compact-Steep-Spectrum (CSS) sources are compact, young
  radio AGN whose spectrum rises then falls. We build a small, tested, CPU-only tool that
  selects peaked-spectrum candidates from three public surveys (TGSS 150 MHz, NVSS 1.4 GHz,
  VLASS 3 GHz) by spectral curvature: a low-frequency index (150-1400 MHz) against a
  high-frequency index (1400-3000 MHz), with the VLASS Quick-Look flux-scale correction
  applied. Two selection effects have clean fixes: peaked sources are faint at 150 MHz, so a
  TGSS non-detection is used as an upper limit (a lower bound on the low index), with the
  limit taken from the field's own local rms (7 sigma = 29.4 mJy here) rather than a
  survey-wide value; and the NVSS-to-VLASS resolution mismatch fakes steep turnovers, cut by
  an index floor that rejects 94 of 409 field sources. The candidate count is
  limit-dominated and is committed across a sweep (8, 6, 1, 0 candidates at limits of 20,
  25, 29.4, 39.9 mJy); at the field-local limit the cone retains 1 peaked and 1 GHz-peaked
  source, published with fluxes, index errors, and SIMBAD/NED identifications. Two
  literature comparisons calibrate the selection: the MHz-peaked Callingham et al. (2017)
  sample yields 0/81 flagged below 250 MHz (those sources are TGSS-detected and steep, so
  this restates the sample), 3/26 at 250-500 MHz and 1/6 above; for the Dallacasa et al.
  (2000) HFP candidate list, using measured TGSS fluxes (83/100 detected), 53% are
  optically-thick-rising, 38% still rising at 3 GHz, and 32% fall from 150 MHz to 1.4 GHz.
  A tooling and methodology contribution with a published candidate list, not a discovery.

abstract: |
  Sofue & Kohno (2025) derived the definitive modern inner rotation curve (RC) of the Milky
  Way by the terminal-velocity method (TVM) applied to HI4PI and CO longitude-velocity data,
  published it as machine-readable tables, and decomposed it into bulge, disc, and NFW halo,
  quoting a halo-only local dark-matter density $\rho_{\rm DM} = 0.107$ GeV cm$^{-3}$ -- a
  factor $\sim$3 below the $\sim$0.3 GeV cm$^{-3}$ consensus value, which they frame as a
  lower limit. I replicate the analysis independently at both ends. (1) From their published
  tables: their $\rho_{\rm DM}$ arithmetic reproduces exactly (through the $4\pi$ convention
  their halo equations absorb), but an unconstrained refit of the same curve, same model
  family, fits marginally better (11.8 vs 13.6 km s$^{-1}$ rms) at $\rho_{\rm DM} = 0.24$ GeV
  cm$^{-3}$, and all 8 variants of a profile/range/weighting sensitivity scan land in
  0.19-0.32: the published curve is fully compatible with the consensus density, and the
  factor-3 gap is disc-halo degeneracy width, not tension. (2) From raw HI4PI data (1113
  tangent-point sightlines in both quadrants): their Table 2 curve reproduces at the
  $\sim$8.8 km s$^{-1}$ level, their east-west asymmetry replicates in period and phase, and
  a head-to-head of terminal-velocity estimators measures the fixed-threshold rule to read
  $+17.9$ km s$^{-1}$ high of Gaussian decomposition -- with the calibrated dispersion
  corrections of the two estimators (9.5 vs 26.6 km s$^{-1}$) bracketing the paper's adopted
  15 km s$^{-1}$.


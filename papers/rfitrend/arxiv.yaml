abstract: |
  The e-CALLISTO network has recorded 45--870 MHz dynamic spectra worldwide since 2002, an
  unintended long-baseline record of the radio-frequency-interference (RFI) environment. The
  only published RFI-trend study on it is a two-epoch (2012 vs 2019) campaign finding
  increased interference at the Spanish sites, stopping in 2019 -- the year Starlink
  deployment scaled. We mine the continuous archive across the megaconstellation era: one
  spectrum per station-month over 2012--2026 at 3 long-running stations, reduced to a
  burst-immune occupancy metric (a per-channel time median). Because e-CALLISTO log-power
  drifts with uncalibrated station gain, the primary metric is self-normalizing: the excess
  at the narrowband Starlink unintended-emission (UEM) lines (125/135/150/175 MHz) over
  adjacent channels, tested against the public Starlink on-orbit count. The result is a
  systematics-limited null. The two stations sampling UEM lines disagree in sign, and
  neither behaves like a constellation: HUMAIN's fitted rise (+0.45 [0.27, 0.57] per year)
  is a staircase, not a trend -- single-month steps of -12 (2018.9) and +15 (2022.2)
  separate plateaus within which no regime rises, and the downward step spans exactly the
  0-to-1900-satellite deployment interval; ALMATY falls (-0.13 [-0.22, -0.02] per year), a
  fall the committed flank-contamination arm reproduces quantitatively. The sign
  disagreement (1 rising, 1 falling; coherent=no) is consistent with per-station and
  local-RFI effects dominating, and the null carries its measured sensitivity: the
  coherence criterion reaches 90% power only for a common rise of ~15 log-units, larger
  than the largest excursion in the data. The positive pooled slope survives an equal-n
  subsample (0.26/yr), so it is amplitude-dominated, not a count artifact. We therefore
  claim no Starlink attribution.

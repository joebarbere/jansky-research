name: paper

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-paper:
    runs-on: ubuntu-latest
    steps:
      # `jansky` resolves from its pinned git tag (pyproject.toml [tool.uv.sources]).
      - name: Checkout jansky-research
        uses: actions/checkout@v7
        with:
          path: jansky-research
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Generate every slice's figures + macros via the static-slice DAG (Snakemake, offline)
        working-directory: jansky-research
        env:
          UV_PYTHON: "3.12" # the `workflow` extra (Snakemake) needs Python >=3.11
        run: |
          uv sync --extra workflow --extra fdmt
          uv run --extra workflow snakemake -s workflow/Snakefile -j4
      - name: Install tectonic
        uses: WtfJoke/setup-tectonic@v4
      # tectonic fetches every LaTeX package and font from relay.fullyjustified.net on each
      # run. That relay 429s under load — it took out this workflow and `release` on
      # 2026-08-19, and flaked twice the day before — so the bundle is cached. After one
      # successful run the compile step needs no network at all. `restore-keys` lets a
      # partial cache from an earlier run seed the next one rather than starting cold.
      # Restore/save are split (rather than one `actions/cache`) so the save runs with
      # `if: always()`. A combined step skips its post-save when the job fails, which is
      # exactly the case that matters here: a 429-interrupted run still downloads part of
      # the bundle, and keeping that partial cache lets successive runs converge instead
      # of each starting cold. Rolling key — the bundle depends on which packages are
      # used, not on the prose, so hashing the .tex files would be wrong.
      - name: Restore the tectonic package bundle
        uses: actions/cache/restore@v4
        with:
          # tectonic's XDG cache is LOWERCASE `tectonic`; older builds used `Tectonic`.
          # Both are listed because a wrong path here fails SILENTLY: actions/cache logs
          # "Path Validation Error ... no cache is being saved" as a *warning*, the step
          # still goes green, and nothing is ever cached (measured on run 32216228939).
          path: |
            ~/.cache/tectonic
            ~/.cache/Tectonic
          key: tectonic-bundle-v33-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tectonic-bundle-v33-${{ runner.os }}-
      - name: Compile every paper (main + any extra, e.g. the RNAAS note)
        working-directory: jansky-research
        run: |
          for tex in papers/*/*.tex; do
            grep -ql '\\documentclass' "$tex" || continue
            echo "==> building $tex"
            (cd "$(dirname "$tex")" && tectonic "$(basename "$tex")")
          done
      - name: Save the tectonic package bundle (even on failure — partial is useful)
        if: always()
        uses: actions/cache/save@v4
        with:
          # tectonic's XDG cache is LOWERCASE `tectonic`; older builds used `Tectonic`.
          # Both are listed because a wrong path here fails SILENTLY: actions/cache logs
          # "Path Validation Error ... no cache is being saved" as a *warning*, the step
          # still goes green, and nothing is ever cached (measured on run 32216228939).
          path: |
            ~/.cache/tectonic
            ~/.cache/Tectonic
          key: tectonic-bundle-v33-${{ runner.os }}-${{ github.run_id }}
      - name: Upload the PDFs
        uses: actions/upload-artifact@v7
        with:
          name: papers
          path: jansky-research/papers/*/*.pdf

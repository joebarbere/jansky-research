name: paper

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-paper:
    runs-on: ubuntu-latest
    steps:
      # `jansky` resolves from its pinned git tag (pyproject.toml [tool.uv.sources]).
      - name: Checkout jansky-research
        uses: actions/checkout@v4
        with:
          path: jansky-research
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Generate every slice's figures + macros via the static-slice DAG (Snakemake, offline)
        working-directory: jansky-research
        env:
          UV_PYTHON: "3.12" # the `workflow` extra (Snakemake) needs Python >=3.11
        run: |
          uv sync --extra workflow --extra fdmt
          uv run --extra workflow snakemake -s workflow/Snakefile -j4
      - name: Install tectonic
        uses: WtfJoke/setup-tectonic@v3
      # tectonic fetches every LaTeX package and font from relay.fullyjustified.net on each
      # run. That relay 429s under load — it took out this workflow and `release` on
      # 2026-08-19, and flaked twice the day before — so the bundle is cached. After one
      # successful run the compile step needs no network at all. `restore-keys` lets a
      # partial cache from an earlier run seed the next one rather than starting cold.
      - name: Cache the tectonic package bundle
        uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          # Rolling key: every run saves (picking up any newly-used package), and
          # restore-keys pulls the most recent previous cache. Keying on the .tex files
          # would be wrong — the bundle depends on which packages are used, not the prose,
          # which changes constantly here.
          key: tectonic-bundle-v33-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tectonic-bundle-v33-${{ runner.os }}-
      - name: Compile every paper (main + any extra, e.g. the RNAAS note)
        working-directory: jansky-research
        run: |
          for tex in papers/*/*.tex; do
            grep -ql '\\documentclass' "$tex" || continue
            echo "==> building $tex"
            (cd "$(dirname "$tex")" && tectonic "$(basename "$tex")")
          done
      - name: Upload the PDFs
        uses: actions/upload-artifact@v4
        with:
          name: papers
          path: jansky-research/papers/*/*.pdf

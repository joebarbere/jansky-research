name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # `jansky` resolves from its pinned git tag (pyproject.toml [tool.uv.sources]),
      # so CI installs exactly what `git clone && uv sync` gives anyone else.
      - name: Checkout jansky-research
        uses: actions/checkout@v4
        with:
          path: jansky-research
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync
        working-directory: jansky-research
        run: uv sync --extra fdmt  # CPU torch wheel (pinned index) for the fdmt/singlepulse tests
      - name: Lint
        working-directory: jansky-research
        run: uv run ruff check src/ tests/
      - name: Format check
        working-directory: jansky-research
        run: uv run ruff format --check src/ tests/
      - name: Typecheck
        working-directory: jansky-research
        run: uv run mypy
      - name: Test + coverage floor
        working-directory: jansky-research
        run: uv run pytest --cov=jansky_research --cov-report=term-missing
